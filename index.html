<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#168b55">
<title>Pengembaraan Ranger: Jom Sebut!</title>
<style>
:root {
  --forest: #17643d;
  --leaf: #41a946;
  --leaf-light: #8bcf45;
  --wood: #7f4528;
  --wood-dark: #482617;
  --cream: #fff4d8;
  --blue: #087bd5;
  --navy: #163e70;
  --gold: #ffc83d;
}

* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
  color: #4d311d;
  background: linear-gradient(#36b9f4 0%, #b5eaff 62%, #72c957 100%);
}
button {
  font: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 4px solid #ffbf3f; outline-offset: 3px; }
.app {
  width: min(100%, 1680px);
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 auto;
  padding: 12px 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
}
header {
  min-height: 68px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 5;
}
.brand {
  width: fit-content;
  padding: 10px 24px;
  color: #fff8e7;
  font-weight: 900;
  font-size: clamp(1rem, 2vw, 1.35rem);
  border: 4px solid #542b16;
  border-radius: 20px 25px 18px 24px;
  background: linear-gradient(#a96536, #69351f);
  box-shadow: inset 0 2px 0 #e9a35e, 0 5px 0 #3e2919, 0 8px 12px #155b5b44;
  text-shadow: 0 2px 2px #482617;
}
.stats { display: flex; gap: 14px; }
.pill {
  min-width: 210px;
  min-height: 58px;
  padding: 8px 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  color: #fff8e7;
  font-size: clamp(1rem, 2vw, 1.4rem);
  font-weight: 900;
  white-space: nowrap;
  border: 4px solid #4a2817;
  border-radius: 17px 23px 16px 22px;
  background: linear-gradient(#a45c32, #67331e);
  box-shadow: inset 0 2px 0 #e8a05b, 0 5px 0 #3d2718;
  text-shadow: 0 2px 2px #482617;
}
#levelDisplay::before { content: "⚑"; font-size: 1.45em; color: #fff; }
#scoreDisplay::before { content: "⭐"; font-size: 1.2em; }
.home-btn {
  width: 60px;
  height: 60px;
  border: 4px solid #4b2917;
  border-radius: 17px;
  background: linear-gradient(#a96536, #69351f);
  box-shadow: inset 0 2px 0 #e9a35e, 0 5px 0 #3d2718;
  color: #fff;
  font-size: 1.85rem;
}
.game-layout { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0; }
.scene {
  position: relative;
  flex: 1;
  min-height: 430px;
  overflow: hidden;
  isolation: isolate;
  border: 5px solid #fff0bd;
  border-radius: 28px 28px 10px 10px;
  background:
    radial-gradient(ellipse at 77% 59%, #d6f6ff99 0 12%, transparent 12.5%),
    linear-gradient(180deg, #3bbbf3 0%, #99ddf8 44%, #78c9e6 55%, #54b75a 56%, #72cc4e 100%);
  box-shadow: 0 7px 0 #9a6c39, 0 12px 24px #144c4733;
}
.scene::before {
  content: "";
  position: absolute;
  inset: 26% 0 18%;
  z-index: 0;
  background:
    radial-gradient(ellipse at 11% 84%, #168e61 0 12%, transparent 12.5%),
    radial-gradient(ellipse at 29% 87%, #229d69 0 17%, transparent 17.5%),
    radial-gradient(ellipse at 54% 88%, #187d59 0 18%, transparent 18.5%),
    radial-gradient(ellipse at 74% 84%, #238a5b 0 16%, transparent 16.5%),
    radial-gradient(ellipse at 95% 85%, #147651 0 17%, transparent 17.5%);
}
.sun {
  position: absolute;
  right: 12%;
  top: 8%;
  width: 66px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #ffe578;
  box-shadow: 0 0 0 14px #ffe57855, 0 0 32px #fff0a9;
  animation: sunPulse 4s ease-in-out infinite alternate;
}
@keyframes sunPulse { to { transform: scale(1.08); box-shadow: 0 0 0 20px #ffe57833, 0 0 40px #fff0a9; } }
.cloud {
  position: absolute;
  z-index: 0;
  top: 16%;
  width: 110px;
  height: 35px;
  border-radius: 50px;
  background: #ffffffee;
  filter: drop-shadow(0 4px 3px #377b8c33);
}
.cloud::before, .cloud::after {
  content: "";
  position: absolute;
  bottom: 0;
  border-radius: 50%;
  background: #ffffffee;
}
.cloud::before { width: 48px; height: 48px; left: 14px; }
.cloud::after { width: 62px; height: 62px; left: 43px; }
.c1 { left: 8%; animation: cloudDrift 18s ease-in-out infinite alternate; }
.c2 { left: 63%; top: 24%; transform: scale(.75); animation: cloudDrift 22s ease-in-out infinite alternate-reverse; }
@keyframes cloudDrift { to { translate: 25px 0; } }
.mountain {
  position: absolute;
  z-index: 0;
  bottom: 31%;
  width: 0;
  height: 0;
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-bottom: 190px solid #68abb1;
  opacity: .85;
}
.m1 { left: 20%; transform: scale(.82); }
.m2 { left: 43%; border-bottom-color: #5598a5; transform: scale(1.2); }
.m3 { right: -3%; border-bottom-color: #6eb1a0; transform: scale(.9); }
.tree {
  position: absolute;
  z-index: 2;
  bottom: 24%;
  width: 25px;
  height: 118px;
  border-radius: 12px;
  background: linear-gradient(90deg, #69402a, #a96934 48%, #5c3421);
}
.tree::before {
  content: "";
  position: absolute;
  left: -43px;
  top: -61px;
  width: 110px;
  height: 112px;
  border-radius: 48% 52% 43% 57%;
  background: #218e50;
  box-shadow: 24px -18px 0 #48ac4c, -23px 14px 0 #65bd4c, 17px 20px 0 #278c4a;
}
.t1 { left: 5%; transform: scale(1.1); }
.t2 { left: 24%; transform: scale(.82); }
.t3 { right: 25%; transform: scale(1.08); }
.t4 { right: 5%; transform: scale(1.18); }
.waterfall {
  position: absolute;
  z-index: 1;
  right: 4%;
  top: 39%;
  width: 8%;
  height: 42%;
  background: linear-gradient(90deg, #72ddff, #e8ffff 23%, #52c7f1 47%, #c7f7ff 67%, #53bde6);
  clip-path: polygon(10% 0, 100% 0, 92% 100%, 0 100%);
  border-radius: 0 0 38% 30%;
  filter: drop-shadow(0 4px 5px #12618b66);
}
.river {
  position: absolute;
  z-index: 1;
  right: 0;
  bottom: 18%;
  width: 13%;
  height: 20%;
  background: repeating-linear-gradient(165deg, #36bce9 0 14px, #c6f7ff 15px 18px, #36bce9 20px 32px);
  clip-path: polygon(0 0, 100% 8%, 100% 100%, 4% 100%);
}
.ground {
  position: absolute;
  z-index: 3;
  left: 0;
  right: 0;
  bottom: 0;
  height: 25%;
  background:
    radial-gradient(ellipse at 10% 88%, #aa7042 0 6%, transparent 6.5%),
    radial-gradient(ellipse at 30% 92%, #704b35 0 7%, transparent 7.5%),
    radial-gradient(ellipse at 53% 90%, #a87547 0 7%, transparent 7.5%),
    radial-gradient(ellipse at 76% 90%, #785139 0 8%, transparent 8.5%),
    linear-gradient(#a3df52 0 12%, #579c3a 13% 25%, #8d5a36 26% 100%);
  border-top: 8px solid #c8f36d;
}
.ground::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -8px;
  height: 16px;
  background: repeating-linear-gradient(90deg, #72c849 0 24px, #a1dc51 24px 48px);
  border-radius: 8px;
}
.path {
  position: absolute;
  z-index: 4;
  left: 0;
  right: 0;
  bottom: 17%;
  height: 11%;
  background: linear-gradient(#e8b26c, #c07b41);
  border-top: 5px solid #ffdc92;
  border-bottom: 6px solid #875333;
  box-shadow: 0 4px 8px #53301c44;
}
.ranger, .obstacle {
  position: absolute;
  z-index: 5;
  bottom: 18%;
  line-height: 1;
  filter: drop-shadow(0 6px 4px #3a281d66);
}
.ranger {
  left: 6%;
  font-size: clamp(3.6rem, 8vw, 6.8rem);
  transition: left 1.2s cubic-bezier(.34, 1.56, .64, 1);
}
.ranger.moving { animation: rangerBounce .24s infinite alternate ease-in-out; }
.obstacle {
  left: 45%;
  font-size: clamp(3.2rem, 7vw, 5.3rem);
  transition: opacity .35s, transform .35s;
}
.obstacle.hit { animation: shake .4s ease-in-out; }
@keyframes rangerBounce { to { translate: 0 -9px; rotate: 2deg; } }
@keyframes shake {
  0%,100% { translate: 0; rotate: 0; }
  25% { translate: -9px; rotate: -5deg; }
  50% { translate: 9px; rotate: 5deg; }
  75% { translate: -5px; rotate: -3deg; }
}
.scene-label {
  position: absolute;
  z-index: 6;
  left: 16px;
  bottom: 34%;
  padding: 9px 16px;
  color: #fff5d9;
  font-size: 1rem;
  font-weight: 900;
  border: 3px solid #61361e;
  border-radius: 10px;
  background: linear-gradient(#a96334, #75401f);
  box-shadow: inset 0 2px 0 #e6a454, 0 4px 0 #4f321e;
}
.prompt-card {
  position: absolute;
  z-index: 7;
  top: 4%;
  left: 27%;
  width: min(49%, 740px);
  min-height: 190px;
  padding: 22px 28px 20px;
  border: 7px solid #6e3b20;
  border-radius: 34px 42px 30px 38px;
  background: linear-gradient(145deg, #fff8e7, #ffedc5);
  box-shadow: inset 0 0 0 3px #d99c58, 0 8px 0 #482c1d, 0 14px 24px #2f634144;
}
.prompt-card::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -13px;
  border: 4px solid #bc7a3c;
  border-radius: 37px 45px 34px 42px;
  pointer-events: none;
}
.topic {
  width: fit-content;
  min-width: 70%;
  margin: -5px 0 14px;
  padding: 7px 22px;
  color: #fff4e4;
  font-size: clamp(.95rem, 1.6vw, 1.35rem);
  font-weight: 900;
  text-align: center;
  border-radius: 0 28px 28px 0;
  background: linear-gradient(90deg, #72402b, #995c3d);
  text-shadow: 0 2px 2px #4b2918;
}
.prompt-row { display: flex; align-items: center; justify-content: center; }
.sentence-container { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.sentence {
  color: var(--navy);
  font-size: clamp(1.45rem, 3vw, 2.55rem);
  font-weight: 1000;
  line-height: 1.2;
  text-align: center;
  text-shadow: 0 1px #fff;
}
.audio-btn {
  min-height: 52px;
  padding: 8px 16px;
  color: #fff;
  font-weight: 900;
  border: 3px solid #0a4b86;
  border-radius: 17px;
  background: linear-gradient(#188fe3, #0866b8);
  box-shadow: 0 4px 0 #084876;
}
.audio-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.panel {
  position: relative;
  z-index: 8;
  min-height: 218px;
  padding: 14px 20px;
  display: grid;
  grid-template-columns: minmax(150px, 225px) minmax(360px, 1fr) minmax(220px, 290px);
  gap: 22px;
  align-items: center;
  border: 5px solid #ffedc5;
  border-radius: 26px;
  background: linear-gradient(135deg, #fff4d8, #ffe4ad);
  box-shadow: inset 0 0 0 3px #e8c08a, 0 7px 0 #bf8954;
}
.target-card {
  min-height: 170px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 4px solid #e3c092;
  border-radius: 24px;
  background: #fff8e9;
  box-shadow: inset 0 2px 0 white;
}
.target-art {
  width: min(100%, 150px);
  aspect-ratio: 1.45;
  display: grid;
  place-items: center;
  border: 3px solid #b5dca0;
  border-radius: 18px;
  background:
    radial-gradient(ellipse at 22% 80%, #4caf50 0 22%, transparent 22.5%),
    radial-gradient(ellipse at 72% 75%, #278a4c 0 27%, transparent 27.5%),
    linear-gradient(#8edbf4 0 55%, #68be50 56%);
  font-size: clamp(2.4rem, 4vw, 3.4rem);
  filter: drop-shadow(0 3px 2px #638c5c44);
}
.target-caption { color: #563921; font-weight: 900; font-size: 1rem; }
.controls {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(145px, 190px) 1fr 1fr;
  gap: 14px;
  align-items: center;
  justify-items: center;
}
button { transition: transform .15s ease, filter .15s ease, box-shadow .15s ease; }
button:active:not(:disabled) { transform: translateY(3px); }
.mic {
  grid-row: 1 / span 2;
  width: clamp(132px, 14vw, 180px);
  aspect-ratio: 1;
  padding: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: white;
  font-size: .95rem;
  font-weight: 900;
  line-height: 1.05;
  text-align: center;
  border: 7px solid #d8f6ff;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 25%, #37c4ff, #0785ed 64%, #0767c6);
  box-shadow: 0 0 0 5px #43b9fa, 0 0 0 11px #75d8ff88, 0 8px 0 #07508e, 0 0 28px #3bc4ff;
}
.mic span:first-child { font-size: 2.8rem; }
.mic:hover { filter: brightness(1.08); }
.mic.listening { background: radial-gradient(circle at 35% 25%, #ff6960, #d72c2c 66%, #a71414); box-shadow: 0 0 0 5px #ffc1ac, 0 0 0 11px #ff8f7888, 0 8px 0 #761414, 0 0 28px #ff8f78; animation: micPulse 1s infinite alternate; }
.mic:disabled { opacity: .7; cursor: wait; }
@keyframes micPulse { to { transform: scale(1.03); } }
.retry, .next {
  width: 100%;
  min-height: 76px;
  padding: 10px 12px;
  border-radius: 23px;
  font-weight: 900;
  font-size: clamp(.9rem, 1.25vw, 1.1rem);
  line-height: 1.1;
}
.retry { color: #fff; border: 3px solid #334b70; background: linear-gradient(#8899b4, #596b88); box-shadow: 0 5px 0 #45536b; }
.retry:hover:not(:disabled), .next:hover:not(:disabled) { filter: brightness(1.08); }
.next { color: #fff; border: 3px solid #936338; background: linear-gradient(#5bd06d, #20a74f); box-shadow: 0 5px 0 #176333; }
.next:disabled { color: #e9e9ee; border-color: #9296a0; background: linear-gradient(#b3b7c1, #898e9c); box-shadow: 0 5px 0 #6e7481; cursor: not-allowed; }
.status {
  min-height: 62px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 2px solid #c2dfb8;
  border-radius: 17px;
  background: #f3fae9;
  color: #355d3c;
  font-size: .91rem;
  font-weight: 800;
  line-height: 1.35;
}
.status-icon { flex: 0 0 auto; font-size: 1.35rem; }
.status.good { color: #17632d; border-color: #74ce8a; background: #e0f8e5; }
.status.bad { color: #8e321f; border-color: #f0b29b; background: #fff0e7; }
.status.info { color: #184f83; border-color: #b1d4f4; background: #e9f4ff; }
.feedback { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.progress-text { display: flex; justify-content: space-between; margin-bottom: 5px; color: #6a6551; font-size: .75rem; font-weight: 900; }
.progress { height: 13px; overflow: hidden; border-radius: 99px; background: #d5d8c6; box-shadow: inset 0 2px 4px #0002; }
.progress > div { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #77d445, #19a84f); transition: width .4s ease; }
.hidden { display: none !important; }
#canvas-overlay { position: absolute; inset: 0; z-index: 6; width: 100%; height: 100%; pointer-events: none; }
@media (max-width: 1000px) {
  .app { padding: 10px; gap: 10px; }
  header { grid-template-columns: 1fr auto; }
  .brand { display: none; }
  .stats { justify-self: start; }
  .pill { min-width: 155px; min-height: 52px; padding: 6px 14px; }
  .panel { grid-template-columns: minmax(120px, 165px) minmax(300px, 1fr); gap: 12px; }
  .feedback { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 190px; align-items: center; }
  .controls { grid-template-columns: minmax(125px, 160px) 1fr 1fr; gap: 10px; }
  .target-card { min-height: 145px; }
  .target-art { width: 110px; }
}
@media (max-width: 640px) {
  .app { min-height: 100svh; padding: 7px; gap: 8px; }
  header { min-height: 52px; gap: 8px; }
  .stats { gap: 7px; }
  .pill { min-width: 0; min-height: 44px; padding: 5px 10px; font-size: .86rem; border-width: 3px; border-radius: 14px; }
  .home-btn { width: 48px; height: 48px; font-size: 1.4rem; border-width: 3px; }
  .game-layout { min-height: 0; }
  .scene { min-height: 390px; border-width: 4px; border-radius: 20px 20px 8px 8px; }
  .sun { width: 42px; }
  .mountain { border-left-width: 90px; border-right-width: 90px; border-bottom-width: 120px; }
  .tree { height: 82px; width: 18px; }
  .tree::before { width: 76px; height: 76px; left: -29px; top: -42px; }
  .prompt-card { top: 5%; left: 5%; width: 90%; min-height: 132px; padding: 13px 14px; border-width: 5px; border-radius: 24px; }
  .topic { min-width: 78%; margin: -2px 0 10px; padding: 5px 12px; font-size: .86rem; }
  .sentence-container { gap: 8px; }
  .sentence { font-size: clamp(1.2rem, 5vw, 1.65rem); }
  .audio-btn { min-height: 40px; padding: 5px 11px; font-size: .8rem; border-radius: 13px; }
  .scene-label { left: 8px; bottom: 32%; padding: 5px 9px; font-size: .72rem; border-width: 2px; }
  .ranger, .obstacle { bottom: 17%; }
  .ranger { font-size: 3.8rem; left: 4%; }
  .obstacle { font-size: 3.2rem; }
  .ground { height: 23%; }
  .path { bottom: 15%; height: 10%; }
  .panel {
    min-height: 0;
    padding: 9px;
    grid-template-columns: 74px minmax(90px, 1fr) 104px;
    grid-template-rows: 96px auto auto;
    gap: 8px;
    border-width: 3px;
    border-radius: 19px;
  }
  .target-card { grid-column: 1; grid-row: 1; min-height: 0; height: 96px; gap: 3px; border-width: 2px; border-radius: 14px; }
  .target-art { width: 56px; border-width: 2px; border-radius: 10px; font-size: 1.8rem; }
  .target-caption { font-size: .64rem; text-align: center; }
  .controls { display: contents; }
  .mic {
    grid-column: 2;
    grid-row: 1;
    align-self: center;
    justify-self: center;
    width: min(94px, 100%);
    padding: 6px;
    gap: 1px;
    border-width: 4px;
    box-shadow: 0 0 0 3px #43b9fa, 0 0 0 6px #75d8ff88, 0 4px 0 #07508e;
    font-size: .56rem;
  }
  .mic span:first-child { font-size: 1.65rem; }
  .retry, .next { grid-column: 3; min-height: 43px; padding: 4px 5px; font-size: .68rem; border-width: 2px; border-radius: 13px; box-shadow: 0 3px 0 #45536b; }
  .retry { grid-row: 1; align-self: start; }
  .next { grid-row: 1; align-self: end; }
  .feedback { grid-column: 1 / -1; grid-row: 2 / span 2; display: flex; gap: 6px; }
  .status { min-height: 42px; padding: 6px 8px; gap: 6px; font-size: .72rem; border-radius: 12px; }
  .status-icon { font-size: 1rem; }
  .progress-text { font-size: .63rem; margin-bottom: 3px; }
  .progress { height: 9px; }
}
@media (max-width: 370px) {
  .pill { font-size: .76rem; padding-inline: 7px; }
  .panel { grid-template-columns: 64px minmax(76px, 1fr) 91px; gap: 5px; padding: 7px; }
  .target-card { height: 88px; }
  .target-art { width: 48px; }
  .mic { width: 82px; }
  .retry, .next { font-size: .62rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">🌿 Pengembaraan Ranger</div>
    <div class="stats">
      <div class="pill" id="levelDisplay">Tahap 1 / 9</div>
      <div class="pill" id="scoreDisplay">Markah: 0</div>
    </div>
    <button class="home-btn" id="homeButton" type="button" aria-label="Mula semula permainan">🏠</button>
  </header>

  <div class="game-layout">
    <section class="scene" aria-label="Laluan pengembaraan di hutan">
      <canvas id="canvas-overlay"></canvas>
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="mountain m1"></div>
      <div class="mountain m2"></div>
      <div class="mountain m3"></div>
      <div class="tree t1"></div>
      <div class="tree t2"></div>
      <div class="tree t3"></div>
      <div class="tree t4"></div>
      <div class="waterfall"></div>
      <div class="river"></div>
      <div class="ground"></div>
      <div class="path"></div>
      <div class="scene-label">🌿 Hutan Kita</div>
      <div class="prompt-card">
        <div class="topic">🌳 Tempat di hutan</div>
        <div class="prompt-row">
          <div class="sentence-container">
            <div class="sentence" id="sentence">Harimau makan daging.</div>
            <button class="audio-btn" id="listenBtn" title="Dengar sebutan contoh">🔊 Dengar Sebutan</button>
          </div>
        </div>
      </div>
      <div class="ranger" id="ranger" aria-label="Ranger menghadap ke kanan">🚙</div>
      <div class="obstacle" id="obstacle" aria-label="Halangan">🪵</div>
    </section>

    <section class="panel" aria-label="Kawalan permainan">
      <div class="target-card">
        <div class="target-art" id="placeIcon" aria-hidden="true">🐅</div>
        <div class="target-caption">Haiwan misi</div>
      </div>

      <div class="controls">
        <button class="mic" id="micButton" type="button">
          <span id="micIcon">🎙️</span>
          <span id="micText">Tekan untuk bercakap</span>
        </button>
        <button class="retry" id="retryButton" type="button">↻ Cuba Semula</button>
        <button class="next" id="nextButton" type="button" disabled>➜<br>Tahap Seterusnya</button>
      </div>

      <div class="feedback">
        <div class="status info" id="status" role="status" aria-live="polite">
          <span class="status-icon" id="statusIcon">💡</span>
          <span id="statusText">Sedia untuk bermula! Sebut ayat yang dipaparkan.</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-text">
            <span>Kemajuan Misi</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress" aria-label="Kemajuan permainan">
            <div id="progressBar"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
<script>
"use strict";

const sentences = [
  { text: "Harimau makan daging.", icon: "🐅", obstacle: "🪵" },
  { text: "Buaya besar di dalam kolam.", icon: "🐊", obstacle: "🌳" },
  { text: "Arnab melompat di taman.", icon: "🐇", obstacle: "🪨" },
  { text: "Ikan berenang dalam kolam.", icon: "🐟", obstacle: "🪵" },
  { text: "Kuda berlari di padang.", icon: "🐎", obstacle: "🌳" },
  { text: "Itu belalang Ali.", icon: "🦗", obstacle: "🪨" },
  { text: "Zirafah makan daun.", icon: "🦒", obstacle: "🪵" },
  { text: "Ikan berenang di dalam sungai.", icon: "🐠", obstacle: "🌳" },
  { text: "Taman rimba itu berwarna-warni.", icon: "🌴", obstacle: "🪨" }
];

let currentLevel = 0;
let score = 0;
let levelPassed = false;
let isListening = false;
let recognition = null;
let micStream = null;

const $ = id => document.getElementById(id);
const micButton = $("micButton");
const retryButton = $("retryButton");
const nextButton = $("nextButton");
const listenBtn = $("listenBtn");
const statusBox = $("status");
const statusIcon = $("statusIcon");
const statusText = $("statusText");
const ranger = $("ranger");
const obstacle = $("obstacle");
const canvas = $("canvas-overlay");
const ctx = canvas.getContext("2d");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

// Resize canvas for particles
function resizeCanvas() {
  const scene = document.querySelector('.scene');
  canvas.width = scene.clientWidth;
  canvas.height = scene.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);

// Particle Effects Engine
let particles = [];
function createParticles(x, y) {
  const colors = ['#ffd45a', '#2ca75b', '#ffffff', '#64bd57', '#ff9f43'];
  for (let i = 0; i < 35; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.7) * 10,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      life: 1
    });
  }
}

function updateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25; // gravity
    p.alpha -= 0.02;
    
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (p.alpha <= 0) {
      particles.splice(i, 1);
    }
  }
  if (particles.length > 0) {
    requestAnimationFrame(updateParticles);
  }
}

function triggerSuccessConfetti() {
  resizeCanvas();
  createParticles(canvas.width * 0.75, canvas.height * 0.6);
  requestAnimationFrame(updateParticles);
}

function setStatus(message, kind = "info") {
  statusText.textContent = message;
  statusBox.className = "status " + kind;
  
  if (kind === "good") statusIcon.textContent = "🎉";
  else if (kind === "bad") statusIcon.textContent = "❌";
  else statusIcon.textContent = "💡";
}

function renderLevel() {
  const item = sentences[currentLevel];
  $("levelDisplay").textContent = `Tahap ${currentLevel + 1} / ${sentences.length}`;
  $("scoreDisplay").textContent = `⭐ Markah: ${score}`;
  $("sentence").textContent = item.text;
  $("placeIcon").textContent = item.icon;
  
  obstacle.textContent = item.obstacle;
  obstacle.classList.remove("hit");
  obstacle.style.opacity = "1";
  obstacle.style.transform = "scale(1)";
  
  ranger.style.left = "6%";
  ranger.classList.remove("moving");
  
  const pct = Math.round((currentLevel / sentences.length) * 100);
  $("progressBar").style.width = `${pct}%`;
  $("progressPercent").textContent = `${pct}%`;
  
  levelPassed = false;
  nextButton.disabled = true;
  nextButton.classList.remove("hidden");
  
  micButton.disabled = false;
  micButton.classList.remove("listening");
  $("micIcon").textContent = "🎙️";
  $("micText").textContent = "Tekan untuk bercakap";
  
  retryButton.disabled = false;
  setStatus("Sedia untuk bermula! Sebut ayat yang dipaparkan.", "info");
}

function normalize(s) {
  return s.toLocaleLowerCase("ms-MY")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .replace(/\s+/g, " ").trim();
}

// Similarity calculator combining word overlap and Levenshtein edit distance
function similarity(a, b) {
  a = normalize(a); 
  b = normalize(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  
  const aw = a.split(" "), bw = b.split(" ");
  const common = aw.filter(w => bw.includes(w)).length;
  const overlap = common / Math.max(aw.length, bw.length);
  
  const rows = Array.from({ length: b.length + 1 }, (_, i) => i);
  let prev = rows;
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  const edit = 1 - prev[b.length] / Math.max(a.length, b.length);
  return Math.max(edit, overlap * 0.92);
}

// Audio synth feedback sound
function playTone(type) {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const ctx = new AudioContextClass();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.connect(gain); 
    gain.connect(ctx.destination);
    const now = ctx.currentTime;

    if (type === "success") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
      osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
      osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
      
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      
      osc.start(now); 
      osc.stop(now + 0.52);
    } else {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(164.81, now + 0.15);
      
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      
      osc.start(now); 
      osc.stop(now + 0.36);
    }
    osc.onended = () => ctx.close();
  } catch(e) { 
    console.warn("Bunyi tidak tersedia:", e); 
  }
}

// Text-to-Speech sample generator
function speakSentence(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ms-MY';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  } else {
    setStatus("Sistem sebutan suara tidak disokong pada peranti ini.", "bad");
  }
}

listenBtn.addEventListener('click', () => {
  speakSentence(sentences[currentLevel].text);
});

function passLevel(spoken) {
  if (levelPassed) return;
  levelPassed = true;
  score += 10;
  
  $("scoreDisplay").textContent = `⭐ Markah: ${score}`;
  const pct = Math.round(((currentLevel + 1) / sentences.length) * 100);
  $("progressBar").style.width = `${pct}%`;
  $("progressPercent").textContent = `${pct}%`;
  
  ranger.classList.add("moving");
  ranger.style.left = "72%";
  obstacle.style.opacity = "0.2";
  obstacle.style.transform = "scale(0.8)";
  
  nextButton.disabled = false;
  micButton.disabled = true;
  micButton.classList.remove("listening");
  
  setStatus(`Hebat! Sebutan diterima: “${spoken}”. (+10 Markah) Tekan “Tahap Seterusnya”.`, "good");
  playTone("success");
  triggerSuccessConfetti();
}

function wrongAnswer(spoken) {
  ranger.classList.remove("moving");
  obstacle.classList.remove("hit");
  void obstacle.offsetWidth; // force reflow for animation restart
  obstacle.classList.add("hit");
  
  setStatus(spoken ? `Belum tepat. Sistem mendengar: “${spoken}”. Sila cuba sebut lagi.` : "Tiada suara dikesan. Sila cuba lagi.", "bad");
  playTone("fail");
}

function stopListening() {
  isListening = false;
  micButton.disabled = false;
  micButton.classList.remove("listening");
  $("micIcon").textContent = "🎙️";
  $("micText").textContent = "Tekan untuk bercakap";
}

async function startRecognition() {
  if (levelPassed || isListening) return;

  if (!SpeechRecognition) {
    setStatus("Pelayar ini tidak menyokong pengecaman suara. Sila gunakan Google Chrome di komputer atau Android.", "bad");
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("Akses mikrofon tidak tersedia. Sila gunakan sambungan HTTPS yang selamat.", "bad");
    return;
  }

  micButton.disabled = true;
  $("micText").textContent = "Meminta akses mikrofon…";

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(error) {
    stopListening();
    setStatus("Sila benarkan akses mikrofon untuk memainkan permainan ini.", "bad");
    return;
  }

  micStream.getTracks().forEach(track => track.stop());
  micStream = null;

  try {
    recognition = new SpeechRecognition();
    recognition.lang = "ms-MY";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {
      isListening = true;
      micButton.disabled = false;
      micButton.classList.add("listening");
      $("micIcon").textContent = "🔴";
      $("micText").textContent = "Sedang mendengar…";
      setStatus("Sedang mendengar. Sebut ayat yang dipaparkan sekarang!", "info");
    };

    recognition.onresult = function(event) {
      const spoken = event.results && event.results[0] && event.results[0][0]
        ? event.results[0][0].transcript.trim() : "";
      const target = sentences[currentLevel].text;
      const scoreMatch = similarity(spoken, target);

      if (spoken && scoreMatch >= 0.78) {
        passLevel(spoken);
      } else {
        wrongAnswer(spoken);
      }
    };

    recognition.onerror = function(event) {
      console.error("Speech Error:", event.error);
      stopListening();
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        setStatus("Sila benarkan akses mikrofon dalam tetapan pelayar anda.", "bad");
      } else if (event.error === "no-speech") {
        setStatus("Tiada suara dikesan. Sila cuba sebut sekali lagi.", "bad");
      } else if (event.error === "audio-capture") {
        setStatus("Mikrofon tidak dapat dikesan. Semak tetapan audio peranti anda.", "bad");
      } else {
        setStatus("Pengecaman suara terganggu. Sila cuba lagi.", "bad");
      }
    };

    recognition.onend = function() {
      const wasListening = isListening;
      stopListening();
      if (wasListening && !levelPassed && statusText.textContent.startsWith("Sedang mendengar")) {
        setStatus("Tiada suara dikesan. Sila cuba lagi.", "bad");
      }
    };

    recognition.start();
  } catch(error) {
    console.error(error);
    stopListening();
    setStatus("Gagal memulakan pengecaman suara. Sila cuba lagi.", "bad");
  }
}

micButton.addEventListener("click", () => {
  if (isListening && recognition) {
    try { recognition.stop(); } catch(e) {}
    stopListening();
  } else {
    startRecognition();
  }
});

retryButton.addEventListener("click", () => {
  if (isListening && recognition) {
    try { recognition.abort(); } catch(e) {}
    stopListening();
  }
  
  if (currentLevel === sentences.length - 1 && levelPassed && nextButton.classList.contains("hidden")) {
    // Restart whole game if completed
    currentLevel = 0;
    score = 0;
    retryButton.textContent = "↻ Cuba Semula";
    renderLevel();
    return;
  }

  if (levelPassed) {
    setStatus("Tahap ini sudah selesai! Tekan “Tahap Seterusnya” untuk meneruskan.", "info");
    return;
  }
  
  ranger.style.left = "6%";
  obstacle.style.opacity = "1";
  obstacle.style.transform = "scale(1)";
  setStatus("Cuba lagi! Tekan butang mikrofon dan sebut ayat dengan jelas.", "info");
});

nextButton.addEventListener("click", () => {
  if (!levelPassed) return;
  if (currentLevel < sentences.length - 1) {
    currentLevel++;
    renderLevel();
  } else {
    // Game Victory State
    $("sentence").textContent = "Tahniah, kamu berjaya melepasi semua halangan!";
    $("placeIcon").textContent = "🏆";
    obstacle.textContent = "🎉";
    obstacle.style.opacity = "1";
    ranger.style.left = "72%";
    
    micButton.disabled = true;
    nextButton.disabled = true;
    nextButton.classList.add("hidden");
    retryButton.textContent = "↻ Main Semula Permainan";
    
    $("progressBar").style.width = "100%";
    $("progressPercent").textContent = "100%";
    
    setStatus(`Semua ayat selesai! Markah akhir kamu ialah ${score}. Syabas, Ranger Cemerlang! 🌟`, "good");
    playTone("success");
    triggerSuccessConfetti();
  }
});

// Initial Setup
$("homeButton").addEventListener("click", () => location.reload());
renderLevel();
</script>
</body>
</html>
